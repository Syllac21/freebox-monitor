name: Deploy Freebox Monitor to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./FreeboxMonitor.Worker/Dockerfile
          push: true
          tags: |
            ghcr.io/syllac21/freebox-monitor-worker:latest
            ghcr.io/syllac21/freebox-monitor-worker:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./FreeboxMonitor.Web/Dockerfile
          push: true
          tags: |
            ghcr.io/syllac21/freebox-monitor-web:latest
            ghcr.io/syllac21/freebox-monitor-web:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/freebox-monitor
            sed -i "s|freebox-monitor-worker:.*|freebox-monitor-worker:${{ github.sha }}|" docker-compose.prod.yml
            sed -i "s|freebox-monitor-web:.*|freebox-monitor-web:${{ github.sha }}|" docker-compose.prod.yml
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
